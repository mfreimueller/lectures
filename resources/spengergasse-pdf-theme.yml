# HTL Spengergasse — Asciidoctor PDF theme
#
# Ports the brand colors from the Marp slide theme
# (../../../lectures/resources/marp-theme.css) to a printable PDF handout.
# Primary red #ED1944, secondary blue #004A8D, sourced from
# https://www.spengergasse.at. Base typeface is the bundled Noto Sans
# (via the built-in "default-sans" theme) rather than the Marp deck's
# Roboto/Roboto Condensed, since those aren't available as local font
# files to embed in the PDF. The logo is a local copy
# (spengergasse_logo_red.png) extracted from the Marp theme's embedded
# data URI, so the PDF build has no dependency on the sibling `lectures`
# repo or network access.
extends: default-sans

base:
  font_color: 1A1A1A
  text_align: left

link:
  font_color: 004A8D

heading:
  font_color: 1A1A1A
  font_style: bold
  h1_font_color: ED1944
  h2_font_color: 1A1A1A
  h3_font_color: 1A1A1A
  h4_font_color: 1A1A1A

# Checklist markers — "Was ich bis morgen benötige"
ulist:
  marker:
    font_color: 5A5A5A
    unchecked:
      font_color: 004A8D
      font_size: 13
    checked:
      font_color: 2E7D32
      font_size: 13

quote:
  border_color: ED1944

table:
  border_color: EDEDED
  grid_width: 0.5
  head:
    background_color: ED1944
    font_color: FFFFFF
    font_style: bold
  body:
    stripe_background_color: EDEDED

page:
  margin: [0.95in, 0.67in, 0.67in, 0.67in]

footer:
  height: 0.4in
  font_color: 5A5A5A
  font_size: 9
  border_color: EDEDED
  border_width: 0.75
  recto:
    right:
      content: "{page-number}"
  verso:
    left:
      content: $footer_recto_left_content
    right:
      content: $footer_recto_right_content
